[agentx]
model = "gemma4:31b"
namespace = "project:agentX"
mode = "agent"
approval = "ask"
auto_handoff = true
# auto = 本機有 `amh` 就用官方 AMH；沒有就關記憶，agent 照跑。
# 不要把 memory-hall repo 收成 submodule。記憶是可選基板。
memory_backend = "auto"

# 強制官方 AMH CLI（本機 json，不依賴任何人的 memhall 主機）：
# memory_backend = "amh"
# memory_amh_store = "json"

# 強制打 Memory Hall HTTP（自己的 URL / token，用環境變數）：
# memory_backend = "memhall"
# AGENTX_MEMORY_HALL_URL / AGENTX_MEMORY_HALL_TOKEN

# AMH CLI 轉發到既有 memhall（有 amh 的人可選）：
# memory_backend = "amh"
# memory_amh_store = "memhall"
# memory_amh_path = "http://127.0.0.1:9100"
