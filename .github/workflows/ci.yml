name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  UV_PYTHON_PREFERENCE: only-managed
  # NOTE: do NOT set UV_EXCLUDE_NEWER here (or anywhere) as a *relative* span.
  #
  # uv reads it as a resolver setting. The relative form ("2d") resolves to a
  # fresh absolute timestamp on every invocation, so uv sees the lockfile as
  # produced under different settings and re-resolves ("Resolving despite
  # existing lockfile due to addition of global exclude newer ..."). Every
  # `--frozen` / `--check` step below then fails with "lockfile needs to be
  # updated" — which is exactly what happened: CI was red on every push from
  # 2026-07-15 onward, died at ~13s, and never reached the test suite.
  #
  # The age gate now lives in pyproject.toml [tool.uv] as an ABSOLUTE cutoff.
  # It is recorded in uv.lock [options], so `uv lock` and `uv lock --check` read
  # the same value and agree. See docs/BORROW-FROM-PI.md.

jobs:
  lint-and-supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install ripgrep
        # search_text / find_files / locate_topic shell out to `rg`. Without it
        # those tests fail with FileNotFoundError rather than exercising the code
        # (8 of the 13 failures seen the first time CI actually reached pytest).
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install the project (dev)
        run: uv sync --all-extras --dev --frozen

      # === Supply chain hardening layers (HIGH priority, borrowed from pi) ===

      - name: Check exact pins in pyproject.toml (layer 1)
        run: python scripts/check-pinned-deps.py

      - name: uv lock consistency (lockfile is ground truth)
        run: uv lock --check

      - name: Lockfile review gate script (layer 4 — primarily local pre-commit)
        # The script only acts on staged files (git diff --cached), so in CI this
        # is a no-op / advisory. Real protection for uv.lock changes in PRs comes
        # from human review of the diff + `uv lock --check` + pinned checker + audit.
        # We keep the call so the step is visible and for future "PR diff mode".
        run: python scripts/check-lockfile-commit.py || true

      - name: No legacy task module guard
        run: python scripts/check_no_legacy_task.py

      - name: Vulnerability audit (pip-audit on the locked tree)
        # Equivalent to the "pip-audit / safety check" layer. We pin the tool via
        # uvx --from for determinism (no new permanent dev dep yet). Audit
        # findings are blocking; add --ignore-vuln or a baseline file only with
        # explicit review.
        #
        # pip-audit>=2.9: 2.4.0 (2022) imports `cyclonedx.parser`, which modern
        # cyclonedx-python-lib no longer provides, so it died with
        # ModuleNotFoundError before auditing anything. uvx pins the tool but not
        # its transitive deps, so an "exact pin" can still rot.
        #
        # --no-emit-project: the export otherwise includes agentX itself as an
        # editable requirement, which pip-audit cannot hash ("cannot be installed
        # when requiring hashes, because there is no single file to hash").
        run: uvx --from 'pip-audit==2.9.0' pip-audit --requirement <(uv export --format requirements-txt --frozen --no-dev --no-emit-project)

      # === Existing hygiene ===

      - name: Ruff (via pre-commit config if present, or direct)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests (quick)
        run: uv run pytest -q --tb=no

  # Future: when we have a published artifact / PyPI path, add a job that
  # exercises the "shrinkwrap equivalent" export + hash-pinned install.
  # See docs/BORROW-FROM-PI.md for the planned constraints.txt / --require-hashes step.
